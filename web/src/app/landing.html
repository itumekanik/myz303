<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="AI learning path">Yapay zekâ öğrenme yolu</title>
  <meta name="description" content="Perceptron'dan derin ağlara, tarayıcıda çalışan etkileşimli bir yapay zekâ dersi. / An interactive AI course from the perceptron to deep networks, running in the browser.">
  <link rel="icon" href="{{favicon}}">
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage blocked: follow the system setting */ }
  </script>
  {{styles}}
</head>
<body data-page="landing">
  <header class="topbar">
    <div class="brand">
      <h1 class="brand-h">
        <span class="brand-btn brand-static">
          <svg class="logo pc-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><g><path d="M7 23c4-1 5-6 9-7s6-5 9-8"/><circle cx="7" cy="23" r="2.4"/><circle cx="16" cy="16" r="2.4"/><circle cx="25" cy="8" r="2.4"/></g></svg>
          <span class="brand-text">
            <span class="brand-title" data-i18n data-en="AI learning path">Yapay zekâ öğrenme yolu</span>
            <span class="brand-sub" data-i18n data-en="From the perceptron to deep networks">Perceptron'dan derin ağlara</span>
          </span>
        </span>
      </h1>
    </div>
    <div class="badges">
      <div class="theme-switch" id="lang-switch" role="group" aria-label="Dil / Language">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="theme-switch" id="theme-switch" role="group" aria-label="Tema" data-i18n-attr="aria-label=a.theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Açık" aria-label="Açık" data-i18n-attr="title=theme.light,aria-label=theme.light"><svg class="theme-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></svg></button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Koyu" aria-label="Koyu" data-i18n-attr="title=theme.dark,aria-label=theme.dark"><svg class="theme-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1Z"/></svg></button>
        <button type="button" data-theme-choice="system" aria-pressed="false" title="Sistem teması" aria-label="Sistem teması" data-i18n-attr="title=theme.system,aria-label=theme.system"><svg class="theme-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10.5" rx="1.5"/><path d="M7 17.5h6M10 14v3.5"/></svg></button>
      </div>
    </div>
  </header>

  <!-- Built by landing.ts from the chapter list -->
  <main class="landing" id="landing"></main>
  {{scripts}}
</body>
</html>
