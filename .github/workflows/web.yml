# The static site in web/: checks every push and pull request, and publishes main to GitHub Pages
# together with a ZIP that students can download and open without a server.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Web site

on:
  push:
    branches: [main]
    paths: ["web/**", "Perceptron.py", "MLP.py", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "Perceptron.py", "MLP.py", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: End-to-end tests (served over http and opened from file://)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Add the offline copy (ZIP) to the site
        run: |
          (cd dist && zip -qr ../ai-learning-path.zip . -x '*.map')
          mv ai-learning-path.zip dist/

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Publish to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
