# The static site in web/: checks every push and pull request, and publishes main to GitHub Pages
# together with a ZIP that students can download and open without a server. A version tag (v1.2.3)
# runs the slower tests in Firefox, WebKit and on emulated phones; they never hold back publishing.
# Every job runs only in itumekanik/myz303, the repository that publishes the site.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Web site

on:
  push:
    branches: [main]
    tags: ["v*"]   # path filters do not apply to tags
    paths: ["web/**", "Perceptron.py", "MLP.py", "SimpleCNN.py", "YOLO_SpaceNet.py", "YOLO_SpaceNet_data.py", "dashboard.py", "requirements.txt", "CHANGELOG.md", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "Perceptron.py", "MLP.py", "SimpleCNN.py", "YOLO_SpaceNet.py", "YOLO_SpaceNet_data.py", "dashboard.py", "requirements.txt", "CHANGELOG.md", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces the checks of a pull request, but never interrupts a deployment under way
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  python:
    name: Python scripts and the dashboard
    if: github.repository == 'itumekanik/myz303' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the requirements (PyTorch for the CPU)
        run: pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: The from-scratch scripts run
        run: |
          python Perceptron.py
          python MLP.py

      - name: The YOLO files compile (they download data and train for an hour, so they do not run here)
        run: python -m py_compile YOLO_SpaceNet.py YOLO_SpaceNet_data.py

      - name: The dashboard starts and speaks the page's API version
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          echo '<!doctype html><html><title>smoke test</title></html>' > "$RUNNER_TEMP/site/index.html"
          python dashboard.py --site "$RUNNER_TEMP/site" --no-browser --port 8765 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8765/api/status -o "$RUNNER_TEMP/status.json" && break
            sleep 1
          done
          page=$(sed -n 's/.*SERVER_VERSION = \([0-9]*\).*/\1/p' web/src/engines/cnn/backend.ts)
          server=$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['server_version'])" "$RUNNER_TEMP/status.json")
          echo "page: $page, server: $server"
          test -n "$page" && test "$page" = "$server"

  check:
    name: Lint, test and build
    if: github.repository == 'itumekanik/myz303' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: End-to-end tests (served over http and opened from file://)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Add the offline copy (ZIP) to the site
        run: |
          (cd dist && zip -qr ../ai-learning-path.zip . -x '*.map')
          mv ai-learning-path.zip dist/

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  browsers:
    name: Firefox, WebKit and emulated phones
    if: github.repository == 'itumekanik/myz303' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: End-to-end tests in the other browsers
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browsers

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browsers
          path: web/playwright-report
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: [check, python]
    if: github.repository == 'itumekanik/myz303' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
